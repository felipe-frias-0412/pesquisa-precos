services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_local
      MYSQL_DATABASE: pesquisa_precos
      MYSQL_USER: precos_app
      MYSQL_PASSWORD: precos_local
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=precos_app
      - DB_PASSWORD=precos_local
      - DB_NAME=pesquisa_precos
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"

volumes:
  mysql_data:
