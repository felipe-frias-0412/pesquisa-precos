<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — PreçoCerto</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">PC</span><span>PreçoCerto</span></a><a class="admin-link" href="/">Ver vitrine</a></header>
<main>
  <div class="key-box"><label>Chave administrativa<input id="api-key" type="password" autocomplete="current-password" placeholder="Cole sua ADMIN_API_KEY"></label></div>
  <div id="notice" class="notice hidden"></div>
  <div class="admin-tabs">
    <button class="tab-btn active" data-tab="promotions" type="button">Promoções</button>
    <button class="tab-btn" data-tab="stores" type="button">Estabelecimentos</button>
  </div>
  <section class="admin-shell" id="view-promotions">
    <div class="panel">
      <h1>Gerenciar promoções</h1>
      <form id="promotion-form" class="admin-form">
        <input id="promotion-id" type="hidden">
        <label class="wide">Produto *<input name="product_name" required maxlength="180"></label>
        <label>Categoria *<input name="category" required maxlength="80"></label>
        <label>Marca<input name="brand" maxlength="100"></label>
        <label class="wide">Descrição<textarea name="description" maxlength="500"></textarea></label>
        <label>Preço normal *<input name="original_price" type="number" min=".01" step=".01" required></label>
        <label>Preço promocional *<input name="promotional_price" type="number" min=".01" step=".01" required></label>
        <label class="wide">Estabelecimento *<select name="store_id" required><option value="">Selecione</option></select></label>
        <label>Início *<input name="starts_at" type="datetime-local" required></label>
        <label>Término *<input name="ends_at" type="datetime-local" required></label>
        <label class="wide">URL da imagem<input name="image_url" type="url"></label>
        <label class="wide">Link da oferta<input name="product_url" type="url"></label>
        <label class="wide"><span><input name="active" type="checkbox" checked> Promoção ativa</span></label>
        <div class="actions"><button class="primary" type="submit">Salvar promoção</button><button id="cancel-edit" class="secondary hidden" type="button">Cancelar edição</button></div>
      </form>
    </div>
    <div class="panel"><h2>Promoções cadastradas</h2><div id="admin-list" class="admin-list"><div class="empty">Informe a chave administrativa.</div></div></div>
  </section>
  <section class="admin-shell hidden" id="view-stores">
    <div class="panel">
      <h1>Gerenciar estabelecimentos</h1>
      <form id="store-form" class="admin-form">
        <input id="store-id" type="hidden">
        <label class="wide">Nome *<input name="name" required maxlength="120"></label>
        <label>Cidade *<input name="city" required maxlength="100"></label>
        <label>Estado *<input name="state" required maxlength="2" placeholder="Ex.: MS"></label>
        <label class="wide"><span><input name="active" type="checkbox" checked> Estabelecimento ativo</span></label>
        <div class="actions"><button class="primary" type="submit">Salvar estabelecimento</button><button id="cancel-store-edit" class="secondary hidden" type="button">Cancelar edição</button></div>
      </form>
    </div>
    <div class="panel"><h2>Estabelecimentos cadastrados</h2><div id="store-list" class="admin-list"><div class="empty">Informe a chave administrativa.</div></div></div>
  </section>
</main>
<script src="/admin.js" defer></script>
</body>
</html>
